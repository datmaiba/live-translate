name: LiveTranslate
options:
  bundleIdPrefix: com.datmaiba
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  LiveTranslate:
    type: application
    platform: iOS
    sources:
      - LiveTranslate
    dependencies:
      - framework: Vendor/sherpa-onnx.xcframework
        embed: false
      - framework: Vendor/onnxruntime.xcframework
        embed: false
      - sdk: libc++.tbd
    info:
      path: LiveTranslate/Info.plist
      properties:
        CFBundleDisplayName: "Live Dịch"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Live Dịch cần micro để nghe và dịch hội thoại."
        NSSpeechRecognitionUsageDescription: "Live Dịch chuyển giọng nói thành chữ để dịch Việt ⇄ Anh."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datmaiba.livetranslate
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
  LiveTranslateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LiveTranslateTests
    dependencies:
      - target: LiveTranslate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.datmaiba.livetranslate.tests
schemes:
  LiveTranslate:
    build:
      targets:
        LiveTranslate: all
        LiveTranslateTests: [test]
    test:
      targets:
        - LiveTranslateTests
